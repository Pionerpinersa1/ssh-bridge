<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SSH Bridge</title>
  <link rel="stylesheet" href="xterm.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; display: flex; flex-direction: column; height: 100vh; }
    #top { padding: 8px 16px; background: #111; color: #888; font: 13px monospace; display: flex; gap: 16px; }
    #terminal { flex: 1; padding: 4px; }
  </style>
</head>
<body>
  <div id="top">
    SSH Bridge —
    <span id="status" style="color:#f90">connecting...</span>
    <span id="url-info" style="color:#555"></span>
  </div>
  <div id="terminal"></div>
  <script src="xterm.js"></script>
  <script src="xterm-addon-fit.js"></script>
  <script>
    const term = new Terminal({ cursorBlink: true, theme: { background: '#1a1a1a' } });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();
    window.addEventListener('resize', () => fitAddon.fit());

    const status = document.getElementById('status');
    const urlInfo = document.getElementById('url-info');

    let token = localStorage.getItem('bridge_token') || '';
    if (!token) { token = prompt('Bridge password:') || ''; localStorage.setItem('bridge_token', token); }

    async function getWsUrl() {
      // Try to get current tunnel URL from repo
      try {
        const r = await fetch('https://raw.githubusercontent.com/Pionerpinersa1/ssh-bridge/master/TUNNEL_URL.txt?t=' + Date.now());
        if (r.ok) {
          const url = (await r.text()).trim();
          if (url.startsWith('https://')) {
            return url.replace('https://', 'wss://') + '/browser?token=' + encodeURIComponent(token);
          }
        }
      } catch(e) {}
      // Fallback to same host (if served from the bridge itself)
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      return `${proto}://${location.host}/browser?token=${encodeURIComponent(token)}`;
    }

    async function connect() {
      status.textContent = 'fetching tunnel URL...';
      const wsUrl = await getWsUrl();
      const host = new URL(wsUrl.replace('wss://', 'https://').replace('ws://', 'http://')).hostname;
      urlInfo.textContent = '(' + host + ')';

      const ws = new WebSocket(wsUrl);

      ws.onopen = () => { status.textContent = 'connected'; status.style.color = '#0f0'; };
      ws.onclose = e => {
        status.style.color = '#f00';
        if (e.code === 1006 || e.code === 4003) {
          localStorage.removeItem('bridge_token');
          status.textContent = 'wrong password — reload';
        } else {
          status.textContent = 'disconnected — reconnecting...';
          setTimeout(connect, 5000);
        }
      };
      ws.onmessage = e => term.write(typeof e.data === 'string' ? e.data : new Uint8Array(e.data));
      term.onData(data => ws.readyState === 1 && ws.send(data));
    }

    connect();
  </script>
</body>
</html>

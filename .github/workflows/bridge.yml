name: bridge-runner

on:
  schedule:
    - cron: '0 0,5,10,15,20 * * *'
    - cron: '30 2,7,12,17,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start bridge server
        run: |
          node index.js &
          sleep 2

      - name: Start cloudflare tunnel and publish URL
        run: |
          # install cloudflared
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          # start tunnel, log to file
          cloudflared tunnel --url http://localhost:5000 --no-autoupdate --logfile /tmp/cf.log 2>&1 &
          CF_PID=$!
          # wait for URL to appear in log
          TUNNEL_URL=""
          for i in $(seq 1 40); do
            TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log 2>/dev/null | head -1)
            if [ -n "$TUNNEL_URL" ]; then break; fi
            sleep 2
          done
          echo "Tunnel URL: $TUNNEL_URL"
          if [ -z "$TUNNEL_URL" ]; then
            echo "=== cloudflared log ==="
            cat /tmp/cf.log || true
            exit 1
          fi
          # write URL to repo so browser knows where to connect
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          echo "$TUNNEL_URL" > TUNNEL_URL.txt
          git add TUNNEL_URL.txt
          git commit -m "chore: update tunnel URL [skip ci]"
          git push

      - name: Run bridge connector
        run: timeout 20700 node muse-dial-local.js || true
